<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Inidė Jasnauskaitė — Links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --sans:'Hanken Grotesk',sans-serif; --display:'Syne',sans-serif; --mono:'IBM Plex Mono',monospace;
    --ivory:#FAF7F2; --ink:#1A1A1A; --muted:#8a8580; --faint:#bcb6ae; --hair:#EAE5DD;
    --grad:linear-gradient(90deg,#833AB4,#C13584,#E1306C);
    --grad-ring:linear-gradient(135deg,#833AB4,#C13584,#E1306C,#F77737,#FCAF45);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:var(--sans);background:#ffffff;color:var(--ink);
    display:flex;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;
    padding:36px 20px;-webkit-font-smoothing:antialiased}

  /* ── DESKTOP: telefono rėmas ── */
  .device{position:relative;width:390px;height:min(820px, calc(100dvh - 48px));background:#0d0d0f;border-radius:56px;
    padding:11px;box-shadow:inset 0 0 0 2px #2a2a2e, 0 40px 90px -34px rgba(120,60,110,.4), 0 8px 30px -12px rgba(0,0,0,.28)}
  .screen{position:relative;width:100%;height:100%;border-radius:46px;overflow:hidden;background:var(--ivory);
    display:flex;flex-direction:column}
  .notch{position:absolute;top:13px;left:50%;transform:translateX(-50%);width:104px;height:28px;background:#000;border-radius:16px;z-index:30}

  /* subtilus brand-gradient švytėjimas ant ivory (ne flat) */
  .glow{position:absolute;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(85% 50% at 50% -8%, rgba(225,48,108,.13), transparent 70%),
               radial-gradient(70% 45% at 100% 12%, rgba(131,58,180,.10), transparent 65%),
               radial-gradient(80% 40% at 0% 100%, rgba(247,119,55,.10), transparent 60%)}

  .statusbar{position:relative;z-index:20;display:flex;justify-content:space-between;align-items:center;
    padding:18px 26px 0;font-family:var(--mono);font-size:12px;font-weight:500;color:var(--ink)}
  .statusbar .ico{display:flex;gap:6px;align-items:center}
  .statusbar svg{width:16px;height:12px;fill:var(--ink)}

  .content{position:relative;z-index:10;flex:1;display:flex;flex-direction:column;
    padding:10px 18px 15px;min-height:0}

  /* ── LOGO / profilis (pradinės versijos stilius) ── */
  .hero{text-align:center;flex:none}
  .av{display:block;position:relative;width:70px;height:70px;margin:0 auto 8px;border-radius:50%;
    background:var(--grad-ring);padding:2.5px;cursor:pointer;transition:transform .2s}
  .av:hover{transform:scale(1.04)}
  .name{cursor:pointer}
  .name:focus-visible{outline:2px solid var(--ig-b,#C13584);outline-offset:4px;border-radius:6px}
  /* easter-egg fun-fact banner (paspaudus vardą) */
  .fact-toast{position:absolute;bottom:46px;left:14px;right:14px;z-index:60;display:flex;align-items:center;gap:11px;
    background:rgba(255,255,255,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border:1px solid var(--hair);border-radius:16px;padding:10px 13px;box-shadow:0 14px 34px -14px rgba(120,60,90,.4);
    opacity:0;transform:translateY(14px);pointer-events:none;transition:opacity .3s,transform .3s}
  .fact-toast.show{opacity:1;transform:translateY(0)}
  .fact-toast .fic{width:34px;height:34px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;
    background:var(--grad-ring);color:#fff;font-size:15px}
  .fact-toast .ft{flex:1;min-width:0}
  .fact-toast .ft b{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .fact-toast .ft span{display:block;font-size:12px;font-weight:600;line-height:1.3;margin-top:2px;color:var(--ink)}
  .av .ring{width:100%;height:100%;border-radius:50%;background:#fff;padding:3px}
  .av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
  .name{font-family:var(--display);line-height:1}
  .name .n1{display:block;font-size:16px;font-weight:600;letter-spacing:-.01em;color:var(--ink)}
  .name .n2{display:block;font-size:27px;font-weight:700;font-style:italic;letter-spacing:-.02em;margin-top:1px;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .name .n3{display:block;font-family:var(--mono);font-size:9.5px;font-weight:500;letter-spacing:.22em;
    text-transform:uppercase;color:var(--faint);margin-top:5px}
  .role{font-size:12px;color:var(--muted);margin-top:6px;letter-spacing:.005em}

  .nlabel{display:flex;justify-content:space-between;align-items:center;
    font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);
    margin:11px 4px 8px;flex:none}

  /* ── Notification kortelės (šviesus stilius) ── */
  .notifs{display:flex;flex-direction:column;gap:6px;flex:1 1 auto;min-height:0;overflow-y:auto;scrollbar-width:none;padding-top:11px}
  .notifs::-webkit-scrollbar{display:none}
  .notif{position:relative;display:flex;align-items:center;gap:12px;text-decoration:none;
    background:#fff;border:1px solid var(--hair);border-radius:16px;padding:6px 12px;color:var(--ink);
    box-shadow:0 2px 10px -6px rgba(120,70,90,.14);
    transition:transform .18s cubic-bezier(.32,.72,.22,1),box-shadow .18s,border-color .18s}
  .notif:hover{transform:translateY(-2px);box-shadow:0 12px 26px -12px rgba(120,60,90,.28);border-color:#ddd6cc}
  .notif:active{transform:scale(.98)}
  .notif .ic{width:38px;height:38px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;
    box-shadow:0 3px 9px -2px rgba(0,0,0,.22)}
  .notif .ic svg{width:21px;height:21px;fill:none;stroke:#fff;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .notif .nt{flex:1;min-width:0;display:flex;flex-direction:column}
  .notif .nrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .notif .app{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;font-weight:500;color:var(--muted)}
  .notif .tm{font-family:var(--mono);font-size:9px;color:var(--faint);flex:none}
  .notif .ti{display:block;font-size:14px;font-weight:700;line-height:1.2;margin-top:1px;letter-spacing:-.01em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .notif .su{display:block;font-size:10.5px;font-weight:500;color:var(--muted);margin-top:1px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .notif .chev{flex:none;color:var(--faint);font-size:17px;margin-left:2px}

  /* ── FEATURED (suknelių nuoma) ── */
  .notif.feat{padding:10px 13px;border:0;background:
      linear-gradient(#fff,#fff) padding-box,
      var(--grad-ring) border-box;border:1.5px solid transparent;
    box-shadow:0 8px 24px -12px rgba(225,48,108,.45)}
  .notif.feat::before{content:'';position:absolute;inset:0;border-radius:17px;z-index:-1;
    background:linear-gradient(120deg,rgba(225,48,108,.07),rgba(247,119,55,.05))}
  .notif.feat .ic{width:43px;height:43px;border-radius:13px}
  .notif.feat .ic svg{width:24px;height:24px}
  .notif.feat .ti{font-size:16px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .notif.feat .su{color:#9a6a7c}
  .feat-pill{position:absolute;top:-7px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:8px;font-weight:600;
    letter-spacing:.14em;text-transform:uppercase;color:#fff;background:var(--grad);
    padding:3px 8px;border-radius:999px;box-shadow:0 3px 8px -2px rgba(193,53,132,.5)}

  /* ── Footer (pradinės versijos) ── */
  .foot{flex:none;text-align:center;padding-top:10px}
  .foot .divider{width:46px;height:1.5px;margin:0 auto 8px;border-radius:2px;background:var(--grad-ring);opacity:.55}
  .foot .url{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--faint)}

  .back{position:fixed;top:26px;left:30px;font-family:var(--mono);font-size:11px;letter-spacing:.16em;
    text-transform:uppercase;color:#c3bcc0;text-decoration:none;transition:color .2s;z-index:50}
  .back:hover{color:var(--ink)}
  .deskhint{position:fixed;bottom:22px;left:0;right:0;text-align:center;font-family:var(--mono);
    font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#cfc8c0;z-index:40}

  /* ── MOBILE: telefonas = pats ekranas ── */
  @media (max-width:600px){
    body{padding:0;display:block;background:var(--ivory)}
    .device{width:100%;height:100vh;height:100dvh;border-radius:0;padding:0;box-shadow:none}
    .screen{border-radius:0}
    .notch{display:none}
    .statusbar{padding-top:max(16px,env(safe-area-inset-top,16px))}
    .content{padding:16px 16px max(20px,env(safe-area-inset-bottom,20px))}
    .back,.deskhint{display:none}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
  <a class="back" href="../">← jasnauskaite.lt</a>

  <div class="device" role="region" aria-label="Inidė Jasnauskaitė — links">
    <div class="notch"></div>
    <div class="screen">
      <div class="glow"></div>
      <div class="fact-toast" id="factToast"><div class="fic">✦</div><div class="ft"><b></b><span></span></div></div>

      <div class="statusbar">
        <span id="sbtime">9:41</span>
        <span class="ico">
          <svg viewBox="0 0 18 12"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="4.5" y="4.5" width="3" height="7.5" rx="1"/><rect x="9" y="2" width="3" height="10" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1"/></svg>
          <svg viewBox="0 0 18 12"><path d="M9 10.5a1.2 1.2 0 100 .01zM9 1.5C5.7 1.5 2.7 2.8.5 4.9l1.4 1.4C3.7 4.5 6.2 3.4 9 3.4s5.3 1.1 7.1 2.9l1.4-1.4C15.3 2.8 12.3 1.5 9 1.5zm0 3.7c-2 0-3.7.8-5 2.1l1.4 1.4A5 5 0 019 6.9c1.3 0 2.6.6 3.6 1.5l1.4-1.4A6.9 6.9 0 009 5.2z"/></svg>
          <svg viewBox="0 0 25 12" style="width:23px"><rect x="0.5" y="0.5" width="21" height="11" rx="3" fill="none" stroke="#1A1A1A" stroke-width="1"/><rect x="2" y="2" width="17" height="8" rx="1.5"/><rect x="22.5" y="4" width="2" height="4" rx="1"/></svg>
        </span>
      </div>

      <div class="content">
        <div class="hero">
          <a class="av" href="variant-e-phone-pro.html" aria-label="See portfolio"><div class="ring"><img src="images/profile.jpg" alt="Inidė Jasnauskaitė"></div></a>
          <div class="name" id="logo" role="button" tabindex="0" aria-label="Tap for a fun fact">
            <span class="n1">Inidė</span>
            <span class="n2">Jasnauskaitė</span>
            <span class="n3">Jonaitė · Vilnius</span>
          </div>
          <p class="role">Fashion, beauty &amp; lifestyle creator</p>
        </div>

        <div class="nlabel"><span>Notifications</span><span>now</span></div>
        <div class="notifs" id="notifs"></div>

        <div class="foot">
          <div class="divider"></div>
          <span class="url">jasnauskaite.lt</span>
        </div>
      </div>
    </div>
  </div>

  <p class="deskhint">on your phone, this fills the whole screen</p>

<script>
/* ── @links — vienintelis keičiamas blokas (kategorijos iš site-data.ts) ── */
const IG_GRAD = 'linear-gradient(45deg,#FCAF45,#E1306C,#833AB4)';
const FEAT_GRAD = 'linear-gradient(135deg,#C13584,#E1306C,#F77737)';
const LINKS = [
  { app:'Fashioneer', time:'now', title:'Rent my looks', sub:'Inidė’s wardrobe — available to rent', url:'https://fashioneer.com/users/fshnr-jasnauskaite', ext:true, featured:true, iconBg:FEAT_GRAD,
    svg:'<svg viewBox="0 0 24 24"><path d="M20.4 3.5L16 2l-4 3.5L8 2 3.6 3.5a2 2 0 00-1.3 2.2l.6 3.5a1 1 0 001 .8H6v10a2 2 0 002 2h8a2 2 0 002-2V10h2.1a1 1 0 001-.8l.6-3.5a2 2 0 00-1.3-2.2z"/></svg>' },
  { app:'Instagram', time:'now', title:'Follow on Instagram', sub:'@jasnauskaite · 359K followers', url:'https://www.instagram.com/jasnauskaite/', ext:true, iconBg:IG_GRAD,
    svg:'<svg viewBox="0 0 24 24"><rect x="2.5" y="2.5" width="19" height="19" rx="5.2"/><circle cx="12" cy="12" r="4.6"/><circle cx="17.4" cy="6.6" r="1.2" fill="#fff" stroke="none"/></svg>' },
  { app:'TikTok', time:'2m ago', title:'Follow on TikTok', sub:'@jasnauskaite · 125K followers', url:'https://www.tiktok.com/@jasnauskaite', ext:true, iconBg:'#1A1A1A',
    svg:'<svg viewBox="0 0 24 24"><path d="M9 12.5a3.2 3.2 0 103.2 3.2V4.5a5 5 0 005 4.6" fill="none" stroke="#fff" stroke-width="1.8"/></svg>' },
  { app:'Portfolio', time:'1h ago', title:'Portfolio', sub:'jasnauskaite.lt', url:'variant-e-phone-pro.html', ext:false, iconBg:'#833AB4',
    svg:'<svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>' },
  { app:'Reelize', time:'now', title:'Collaborate', sub:'team@reelize.lt', url:'mailto:team@reelize.lt?subject=Collaboration', ext:false, iconBg:'#C13584',
    svg:'<svg viewBox="0 0 24 24"><path d="M12 3l1.9 5.6L19.5 10l-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.4z" fill="#fff" stroke="none"/></svg>' }
];

document.getElementById('notifs').innerHTML = LINKS.map(function(l){
  return '<a class="notif'+(l.featured?' feat':'')+'" href="'+l.url+'"'+(l.ext?' target="_blank" rel="noopener noreferrer"':'')+'>'
    + (l.featured?'<span class="feat-pill">Inidė’s Closet</span>':'')
    + '<span class="ic" style="background:'+l.iconBg+'">'+l.svg+'</span>'
    + '<span class="nt"><span class="nrow"><span class="app">'+l.app+'</span><span class="tm">'+l.time+'</span></span>'
    + '<span class="ti">'+l.title+'</span><span class="su">'+l.sub+'</span></span>'
    + '<span class="chev">›</span></a>';
}).join('');

/* 🥚 easter-egg: paspaudus vardą iššoka „fun fact" notifikacija (rotacija) */
var FACTS = [
  ['154+ brands', '70 of them came back for more.'],
  ['5.0% engagement', 'The platform average is 1.9%.'],
  ['590M+ views', 'Eight years. One feed. Zero bought.'],
  ['Range', 'A car campaign and a skincare reel — same week.']
];
var _fi = 0, _ft = document.getElementById('factToast'), _ftt = null;
function popFact(){
  var f = FACTS[_fi % FACTS.length]; _fi++;
  _ft.querySelector('b').textContent = f[0];
  _ft.querySelector('span').textContent = f[1];
  _ft.classList.add('show');
  clearTimeout(_ftt); _ftt = setTimeout(function(){ _ft.classList.remove('show'); }, 3600);
}
var _logo = document.getElementById('logo');
_logo.addEventListener('click', popFact);
_logo.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); popFact(); } });

/* 🥚 console */
console.log('%c Inidė Jasnauskaitė · links ','font:600 16px/1.6 sans-serif;color:#C13584');
console.log('%cTap her name on the page — there is more than meets the eye.\nIf you build things too: osvaldas@reelize.lt','font:12px/1.5 monospace;color:#9b9b9b');

/* status-bar laikrodis */
function tick(){
  var d=new Date(), h=d.getHours(), m=d.getMinutes();
  document.getElementById('sbtime').textContent=((h%12)||12)+':'+(m<10?'0':'')+m;
}
tick(); setInterval(tick,15000);
</script>
</body>
</html>
